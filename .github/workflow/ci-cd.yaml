name: CI/CD

on:
  push:
    branches: ["edutech"]
  pull_request:
    branches: ["edutech"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache ~/.m2 (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build, run tests and package
        run: mvn -B -V -e -DskipTests=true package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutech-war
          path: target/*.war

  deploy:
    name: Deploy to production (SCP -> restart Tomcat)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      # add reviewers/protection in repo settings for this environment
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: edutech-war
          path: ./artifact

      - name: Start ssh-agent and add private key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy WAR to remote server (SCP)
        run: |
          scp -o StrictHostKeyChecking=no ./artifact/*.war ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}
        # DEPLOY_PATH example: /opt/tomcat/webapps/edutech.war

      - name: Remote: clean old exploded app & restart Tomcat
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<'EOF'
            set -e
            # optional: remove exploded directory so Tomcat will redeploy the new WAR
            rm -rf "${{ secrets.EXPLODED_PATH }}" || true
            # ensure permissions are correct
            chown -R $USER:$USER "${{ secrets.DEPLOY_DIR }}" || true
            # restart Tomcat (adjust to your server's command)
            sudo systemctl restart tomcat || { echo "systemctl restart failed - fall back to catalina.sh"; $CATALINA_HOME/bin/shutdown.sh || true; $CATALINA_HOME/bin/startup.sh || true; }
          EOF
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH }}
          EXPLODED_PATH: ${{ secrets.EXPLODED_PATH }}
          CATALINA_HOME: ${{ secrets.CATALINA_HOME }}

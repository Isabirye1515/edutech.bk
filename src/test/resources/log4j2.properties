######################################
# Log4j2 Properties Configuration
######################################

# Set the status level of Log4j itself
status = warn
name = PropertiesConfig

######################################
# Appenders
######################################

# Console Appender
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%-5level] [%t] %c{1} - %msg%n

# Rolling File Appender
appender.file.type = RollingFile
appender.file.name = FileAppender
appender.file.fileName = logs/app.log
appender.file.filePattern = logs/app-%d{yyyy-MM-dd}.log.gz

# File Appender Layout
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%-5level] [%t] %c{1} - %msg%n

# File Rolling Policies
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10 MB

######################################
# Root Logger
######################################
rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = FileAppender

######################################
# Custom Package Logging
######################################
# Your application logging
logger.edutech.name = org.edutech
logger.edutech.level = debug
logger.edutech.additivity = false
logger.edutech.appenderRefs = console, file
logger.edutech.appenderRef.console.ref = Console
logger.edutech.appenderRef.file.ref = FileAppender

# Spring framework logging
logger.spring.name = org.springframework
logger.spring.level = info
logger.spring.additivity = false
logger.spring.appenderRefs = console, file
logger.spring.appenderRef.console.ref = Console
logger.spring.appenderRef.file.ref = FileAppender

# Spring Web logging (important for REST controllers)
logger.springweb.name = org.springframework.web
logger.springweb.level = debug
logger.springweb.additivity = false
logger.springweb.appenderRefs = console, file
logger.springweb.appenderRef.console.ref = Console
logger.springweb.appenderRef.file.ref = FileAppender

# Hibernate SQL logging
logger.hibernate.name = org.hibernate.SQL
logger.hibernate.level = debug
logger.hibernate.additivity = false
logger.hibernate.appenderRefs = console, file
logger.hibernate.appenderRef.console.ref = Console
logger.hibernate.appenderRef.file.ref = FileAppender

# Hibernate parameter logging
logger.hibernate_params.name = org.hibernate.type.descriptor.sql.BasicBinder
logger.hibernate_params.level = trace
logger.hibernate_params.additivity = false
logger.hibernate_params.appenderRefs = console, file
logger.hibernate_params.appenderRef.console.ref = Console
logger.hibernate_params.appenderRef.file.ref = FileAppender